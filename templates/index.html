<!DOCTYPE html>
<html>
<head>
    <title>Link Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            /* iPhone-style vibrant mesh gradient background */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #1a1a2e 100%);
            background-attachment: fixed;
            width: 100%;
            padding-top: 125px;
            overflow: hidden;
        }

        /* Soft light glow behind the glass */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(0, 198, 255, 0.2);
            filter: blur(100px);
            border-radius: 50%;
            top: 20%;
            left: 10%;
        }

        .glass-card {
            position: relative;
            width: 90%;
            max-width: 380px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 35px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.1);
            border-right: 1.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            text-align: center;
            z-index: 10;
        }

        /* NEW STAT BADGE STYLE */
        .stat-badge {
            display: inline-block;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Smooth slide up for mobile keyboards */
        .glass-card.active {
            transform: translateY(-85px);
        }

        h1 {
            color: #fff;
            font-weight: 600;
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 18px;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00c6ff;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.3);
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: #007aff;
            border: none;
            border-radius: 18px;
            color: white;
            font-weight: 600;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3);
            margin-bottom: 15px;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-box p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .small-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .copy-success {
            background: #28a745 !important;
            border-color: #28a745 !important;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
            color: #ff4444;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }

        /* SETTINGS ICON STYLE */
        .settings-btn {
            position: absolute;
            top: 12px;
            left: 384px;
            text-decoration: none;
            font-size: 28px;
            z-index: 9999;
            transition: transform 0.2s;
            display: inline-block;
        }
        .settings-btn:hover {
            transform: rotate(45deg);
        }
    </style>
</head>
<body>

{% if session.get('logged_in') %}
    <a href="/settings" class="settings-btn" title="Change Amazon Tag">⚙️</a>
{% endif %}

<div class="glass-card" id="mainCard">
    <div class="stat-badge">{{ total_count }} Links Generated</div>
    <h1>Link Generator</h1>

    <form method="POST" action="/generate">
        <div class="input-group">
            <input type="text" name="asin" placeholder="Enter ASIN" required autocomplete="off" id="asinInput">
        </div>
        <button type="submit">Generate</button>
    </form>

    {% if short_link %}
    <div class="result-box">
        <p>Shortened Link:</p>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <a href="{{ short_link }}" target="_blank" style="color:#00c6ff; word-break: break-all; font-size: 14px;">{{ short_link }}</a>
            <button class="small-btn" onclick="copyResult('{{ short_link }}', this)">Copy Link</button>
        </div>
    </div>
    {% endif %}

    <a href="/" class="back-btn">Back to Search</a>
</div>

<script>
function copyResult(text, btn) {
    const originalText = btn.innerText;
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand('copy');
    document.body.removeChild(textArea);

    btn.innerText = "Done! 🎉 ";
    btn.classList.add("copy-success");
    setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.remove("copy-success");
    }, 1000);
}

// Automatic Moving Up Logic
const asinInput = document.getElementById('asinInput');
const card = document.getElementById('mainCard');

asinInput.addEventListener('focus', () => {
    card.classList.add('active');
});

asinInput.addEventListener('blur', () => {
    if (asinInput.value.trim() === "") {
        card.classList.remove('active');
    }
});
</script>
</body>
</html>
